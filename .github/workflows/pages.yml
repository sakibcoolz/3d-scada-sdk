name: pages

# Publishes the landing page (site/) and the playground demo (at /demo/) to GitHub Pages.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sakibcoolz/playground exec vite build --base=/3d-scada-sdk/demo/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp docs/images/milk-processing-line.png _site/og.png
          cp -r apps/playground/dist _site/demo
          # Local-only models are git-excluded; never publish them even if present.
          rm -rf _site/demo/local-models
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
